<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Atlas Texting</title>
<style>
  :root{
    --purple:#4b2a7b; --purple-deep:#2a1349; --gold:#e3c26b;
    --ink:#1d1428; --muted:#6c6178; --bg:#f4f0f8; --line:#e7e0f0; --card:#fff;
    --in:#ece8f2; --bad:#b4441b; --bad-bg:#fbe5da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{flex:none;background:linear-gradient(160deg,var(--purple),var(--purple-deep));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
  header .t{font-weight:800;font-size:18px}
  header .s{font-size:12.5px;color:#d8cbee}
  header button{margin-left:auto;background:var(--gold);color:var(--purple-deep);border:0;border-radius:99px;padding:8px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
  .app{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
  @media (min-width:760px){.app{grid-template-columns:320px 1fr}}

  /* list */
  .list{overflow-y:auto;background:#fff;border-right:1px solid var(--line)}
  .conv{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;border-bottom:1px solid #f1edf6;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .conv:hover{background:#faf8fd}
  .conv[aria-current="true"]{background:#f1ebfa}
  .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
  .ci{min-width:0;flex:1}
  .cn{display:flex;justify-content:space-between;gap:8px}
  .cn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cn span{flex:none;font-size:12px;color:var(--muted)}
  .cp{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cp.new{color:var(--ink);font-weight:650}
  .empty{padding:28px 16px;text-align:center;color:var(--muted)}

  /* chat */
  .chat{display:flex;flex-direction:column;min-height:0;background:#fbfafd}
  @media (max-width:759px){
    .app.open .list{display:none}
    .app:not(.open) .chat{display:none}
  }
  .ch{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .back{border:0;background:none;font:inherit;font-size:24px;line-height:1;color:var(--purple);padding:2px 8px;cursor:pointer}
  @media (min-width:760px){.back{display:none}}
  .to{flex:1;display:flex;align-items:center;gap:8px;font-weight:700}
  .to label{color:var(--muted);font-weight:600}
  .to input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px}
  .to input:focus{outline:none;border-color:var(--purple)}
  .who small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
  .thread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:5px}
  .b{max-width:82%;padding:9px 12px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;line-height:1.35}
  .b.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:6px}
  .b.out{align-self:flex-end;background:var(--purple);color:#fff;border-bottom-right-radius:6px}
  .b.out.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
  .b a{color:inherit}
  .st{font-size:11px;color:var(--muted);margin:0 6px 6px}
  .st.in{align-self:flex-start}.st.out{align-self:flex-end}
  .compose{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;font:inherit;font-size:16px;line-height:1.35;max-height:150px;min-height:44px}
  textarea:focus{outline:none;border-color:var(--purple)}
  .send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--purple);cursor:pointer;display:grid;place-items:center}
  .send:disabled{opacity:.35;cursor:default}
  .send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:6px 4px 0}
  .err{color:var(--bad)}
  .gate{margin:60px auto;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div><div class="t">Atlas</div><div class="s">Texts from (201) 801-3971</div></div>
  <button id="newBtn">New text</button>
</header>

<div class="app" id="app">
  <nav class="list" id="list"><div class="empty">Loading…</div></nav>
  <section class="chat">
    <div class="ch">
      <button class="back" id="back" aria-label="Back">‹</button>
      <div class="to" id="toNew"><label for="toInput">To</label><input id="toInput" type="tel" inputmode="tel" placeholder="(314) 555-0123" autocomplete="off"></div>
      <div class="to who" id="toWho" hidden></div>
    </div>
    <div class="thread" id="thread"></div>
    <div class="compose">
      <div class="row">
        <textarea id="msg" rows="1" placeholder="Message"></textarea>
        <button class="send" id="send" disabled aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="meta"><span id="status"></span><span id="count"></span></div>
    </div>
  </section>
</div>

<script>
const SB_URL = "https://dvschwyfeuarpaoyfoko.supabase.co";
const SB_KEY = "sb_publishable_WPDhozNdc55NGL76azocCA_iho3vl_Z";
const KEY = new URLSearchParams(location.hash.slice(1)).get("k") || "";
const $ = (id) => document.getElementById(id);
let msgs = [], current = null; // current = E.164 phone of the open thread, or null for "new"

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmtPhone = (p) => { const m = (p || "").match(/^\+1(\d{3})(\d{3})(\d{4})$/); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : p; };
const toE164 = (s) => { const d = String(s).replace(/\D/g, ""); return d.length === 10 ? "+1" + d : d.length === 11 && d[0] === "1" ? "+" + d : null; };
function when(iso){
  const d = new Date(iso), n = new Date();
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === n.toDateString()) return t;
  if ((n - d) < 6 * 864e5) return d.toLocaleDateString([], { weekday: "short" }) + " " + t;
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}
let seen = {}; try { seen = JSON.parse(localStorage.getItem("atlas_seen") || "{}"); } catch {}
const markSeen = (p, at) => { seen[p] = at; try { localStorage.setItem("atlas_seen", JSON.stringify(seen)); } catch {} };

function threads(){
  const by = new Map();
  for (const m of msgs) {
    if (!by.has(m.phone)) by.set(m.phone, { phone: m.phone, name: m.name, items: [] });
    const t = by.get(m.phone); t.items.push(m); if (m.name) t.name = m.name;
  }
  return [...by.values()].map(t => ({ ...t, last: t.items[t.items.length - 1] }))
    .sort((a, b) => String(b.last.at).localeCompare(String(a.last.at)));
}

function renderList(){
  const ts = threads();
  $("list").innerHTML = ts.length ? ts.map(t => {
    const lastIn = [...t.items].reverse().find(m => m.dir === "in");
    const unread = lastIn && (!seen[t.phone] || seen[t.phone] < lastIn.at);
    const init = t.name ? t.name.split(" ").map(w => w[0]).slice(0, 2).join("") : "#";
    return `<button class="conv" data-p="${esc(t.phone)}" aria-current="${t.phone === current}">
      <span class="av">${esc(init)}</span>
      <span class="ci"><span class="cn"><b>${esc(t.name || fmtPhone(t.phone))}</b><span>${when(t.last.at)}</span></span>
      <span class="cp ${unread ? "new" : ""}">${t.last.dir === "out" ? "You: " : ""}${esc(t.last.body)}</span></span></button>`;
  }).join("") : `<div class="empty">No texts yet. Tap New text.</div>`;
  document.querySelectorAll(".conv").forEach(b => b.onclick = () => openThread(b.dataset.p));
}

let lastSig = "";
function renderThread(force){
  const t = current ? threads().find(x => x.phone === current) : null;
  $("toNew").hidden = !!current; $("toWho").hidden = !current;
  if (current) $("toWho").innerHTML = `${esc(t?.name || fmtPhone(current))}${t?.name ? `<small>${fmtPhone(current)}</small>` : ""}`;
  const items = t ? t.items : [];
  const sig = current + "|" + items.length + "|" + items.map(m => m.status || "").join(",");
  if (sig === lastSig && !force) return;
  lastSig = sig;
  const el = $("thread");
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  let html = "";
  items.forEach((m, i) => {
    const fail = m.dir === "out" && (m.error || ["failed", "undelivered"].includes(m.status));
    html += `<div class="b ${m.dir} ${fail ? "fail" : ""}">${linkify(m.body)}</div>`;
    const nx = items[i + 1];
    if (!nx || nx.dir !== m.dir || new Date(nx.at) - new Date(m.at) > 300000) {
      const st = m.dir === "out" ? (fail ? " · Not delivered" : m.status === "delivered" ? " · Delivered" : "") : "";
      html += `<div class="st ${m.dir}">${when(m.at)}${st}</div>`;
    }
  });
  el.innerHTML = html || `<div class="empty">${current ? "No messages yet." : "Type a number above, then your message."}</div>`;
  if (force || nearBottom) el.scrollTop = el.scrollHeight;
  if (t && t.last) markSeen(current, t.last.at);
}

function openThread(phone){
  current = phone; $("app").classList.add("open"); $("status").textContent = "";
  renderList(); renderThread(true); $("msg").focus();
}
function newText(){
  current = null; $("app").classList.add("open"); $("toInput").value = ""; $("status").textContent = "";
  renderList(); renderThread(true); $("toInput").focus(); updateSend();
}

function updateSend(){
  const n = $("msg").value.length;
  $("count").textContent = n ? `${n} chars` : "";
  const target = current || toE164($("toInput").value);
  $("send").disabled = !$("msg").value.trim() || !target;
}
function autosize(){ const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 150) + "px"; updateSend(); }

async function send(){
  const body = $("msg").value.trim();
  const to = current || toE164($("toInput").value);
  if (!body || !to) return;
  $("send").disabled = true; $("status").className = ""; $("status").textContent = "Sending…";
  try {
    const r = await fetch(`${SB_URL}/functions/v1/sms/text`, {
      method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": KEY },
      body: JSON.stringify({ to, body })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    $("msg").value = ""; autosize(); $("status").textContent = "Sent";
    current = j.to || to; await load(); renderThread(true);
  } catch (e) {
    $("status").className = "err"; $("status").textContent = "Didn't send: " + e.message;
  } finally { updateSend(); }
}

async function load(){
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/atlas_inbox`, {
      method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY }, body: JSON.stringify({ k: KEY })
    });
    if (r.status === 401 || r.status === 403) return gate("This link is missing its key. Use the full link.");
    if (!r.ok) throw new Error(r.status);
    msgs = await r.json();
    renderList(); renderThread();
  } catch (e) { /* keep last view; retry on next tick */ }
}
function gate(t){ document.body.innerHTML = `<div class="gate">${t}</div>`; }

$("msg").addEventListener("input", autosize);
$("toInput").addEventListener("input", updateSend);
$("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(hover:hover)").matches) { e.preventDefault(); send(); }
});
$("send").onclick = send;
$("newBtn").onclick = newText;
$("back").onclick = () => { $("app").classList.remove("open"); current = null; renderList(); };

if (!KEY) gate("This link is missing its key. Use the full link.");
else {
  load();
  setInterval(() => { if (!document.hidden) load(); }, 8000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  if (matchMedia("(min-width:760px)").matches) newText();
}
</script>
</body>
</html>
